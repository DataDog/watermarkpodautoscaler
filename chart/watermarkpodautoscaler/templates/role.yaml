{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "watermarkpodautoscaler.fullname" . }}
  labels:
    {{- include "watermarkpodautoscaler.labels" . | nindent 4 }}
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  resourceNames:
    - watermarkpodautoscaler-lock
  verbs:
  - update
  - get
# Both the "" and events.k8s.io events rules below are kept so this chart works
# with either an old WPA controller (posts core/v1 events) or a new one (posts
# events.k8s.io/v1 events via client-go's events API). Do not drop the "" rule
# until old controller versions are no longer supported.
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - 'create'
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - 'create'
  - 'patch'
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
- apiGroups:
  - apps
  - extensions
  resources:
  - replicasets/scale
  - replicationcontrollers/scale
  - deployments/scale
  - statefulsets/scale
  verbs:
  - 'update'
  - 'get'
- apiGroups:
  - apps.openshift.io
  resources:
  - deploymentconfigs/scale
  verbs:
  - 'update'
  - 'get'
- apiGroups:
  - apps
  resourceNames:
  - watermarkpodautoscalers
  resources:
  - deployments/finalizers
  verbs:
  - update
- apiGroups:
  - datadoghq.com
  resources:
  - watermarkpodautoscalers
  - watermarkpodautoscalers/status
  verbs:
  - '*'
{{- end -}}
