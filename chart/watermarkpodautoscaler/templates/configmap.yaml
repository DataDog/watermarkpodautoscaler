{{- if and (include "watermarkpodautoscaler.controllerConfig.enabled" .) (not .Values.controllerConfig.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "watermarkpodautoscaler.controllerConfig.configMapName" . }}
  labels:
    {{- include "watermarkpodautoscaler.labels" . | nindent 4 }}
data:
  {{ .Values.controllerConfig.configMapKey }}: |
    version: v1
    defaults:
      {{- with .Values.controllerConfig.defaults.convergeTowardsWatermark }}
      convergeTowardsWatermark: {{ . | quote }}
      {{- else }}
      {}
      {{- end }}
    {{- if and .Values.targetStretch .Values.targetStretch.mode }}
    targetStretch:
      mode: {{ .Values.targetStretch.mode | quote }}
      {{- /* default only an absent or null ratio: an explicit value, even 0, is rendered for the controller to validate */}}
      ratio: {{ if kindIs "invalid" .Values.targetStretch.ratio }}1{{ else }}{{ .Values.targetStretch.ratio }}{{ end }}
    {{- end }}
{{- end }}
