name: validation
on:
  push:
    branches: [main]
  pull_request:
# Permission forced by repo-level setting; only elevate on job-level
permissions:
  contents: read
  # packages: read
env:
  GO111MODULE: "on"
  PROJECTNAME: "watermarkpodautoscaler"
  GO_VERSION: 1.26
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
        id: go
      - name: Install required packages
        uses: mstksg/get-package@v1
        with:
          apt-get: mercurial jq build-essential
      - name: Check out code into the Go module directory
        uses: actions/checkout@v1
      - name: Install tools
        run: |
          make install-tools
      - name: Run build
        run: |
          make manager
      - name: Run unit/control plane tests (fake cluster)
        run: |
          make test
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s:
          - v1.19.16
          - v1.25.16
          - v1.31.14
          - v1.36.4
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
        id: go
      - name: Install required packages
        uses: mstksg/get-package@v1
        with:
          apt-get: mercurial jq build-essential
      - name: Check out code into the Go module directory
        uses: actions/checkout@v1
      - name: Install tools
        run: |
          make install-tools
      - name: Setup kind for e2e - kube ${{ matrix.k8s }}
        uses: helm/kind-action@v1.15.0
        with:
          config: test/cluster-kind.yaml
          cluster_name: wpa-e2e-test
          node_image: kindest/node:${{ matrix.k8s }}
      - name: Run e2e tests - kube ${{ matrix.k8s }}
        run: |
          export PATH=$PATH:$(pwd)/bin
          kubectl cluster-info --context kind-wpa-e2e-test
          kubectl get pods -n kube-system
          make e2e
