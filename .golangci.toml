version = '2'

[linters]
default = 'all'
disable = [
  'containedctx',
  'contextcheck',
  'cyclop',
  'depguard',
  'dupl',
  'err113',
  'errchkjson',
  'exhaustive',
  'exhaustruct',
  'forcetypeassert',
  'funcorder',
  'funlen',
  'gochecknoglobals',
  'gochecknoinits',
  'gocognit',
  'gocritic',
  'gocyclo',
  'goconst',
  'godot',
  'godox',
  'gomoddirectives',
  'gomodguard',
  'gosec',
  'ireturn',
  'lll',
  'loggercheck',
  'maintidx',
  'mnd',
  'modernize',
  'nestif',
  'nilnil',
  'nlreturn',
  'noinlineerr',
  'nonamedreturns',
  'paralleltest',
  'perfsprint',
  'prealloc',
  'revive',
  'rowserrcheck',
  'sqlclosecheck',
  'tagliatelle',
  'testpackage',
  'thelper',
  'varnamelen',
  'wastedassign',
  'wrapcheck',
  'wsl',
  'wsl_v5'
]

[linters.settings]
[linters.settings.errcheck]
exclude-functions = [
  'fmt.Fprint',
  'fmt.Fprintf'
]

[linters.settings.goconst]
min-len = 3
min-occurrences = 3

[linters.settings.gocyclo]
min-complexity = 12

[linters.settings.govet]
enable = [
  'shadow'
]

[linters.settings.misspell]
locale = 'US'

[linters.exclusions]
generated = 'lax'
paths = [
  'third_party$',
  'builtin$',
  'examples$'
]

[issues]
max-same-issues = 0

[formatters]
enable = [
  'gofmt',
  'goimports'
]

[formatters.exclusions]
generated = 'lax'
paths = [
  'third_party$',
  'builtin$',
  'examples$'
]
